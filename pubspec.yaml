name: data_guardian
description: "DataGuardian IoT — Real-time ESP8266 server room monitoring with alerts, history, and data export."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # ── Networking ──────────────────────────────────────────────────────────────
  http: ^1.6.0

  # ── Local database ──────────────────────────────────────────────────────────
  sqflite: ^2.4.0
  path: ^1.8.4

  # ── Persistence (NEW — saves ESP IP address between restarts) ───────────────
  shared_preferences: ^2.3.2

  # ── Notifications (NEW — OS-level alerts for temperature / water leak) ──────
  flutter_local_notifications: ^17.2.3

  # ── Export ──────────────────────────────────────────────────────────────────
  excel: ^2.1.0
  pdf: ^3.11.0
  path_provider: ^2.1.5
  share_plus: ^10.0.0

  # ── Utilities ───────────────────────────────────────────────────────────────
  crypto: ^3.0.7
  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "C:/Users/dell/Pictures/Saved Pictures/dataguardian_icon.png"

flutter:
  uses-material-design: true
